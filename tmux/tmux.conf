# Fix ESC delay -- without this, tmux waits 500ms after ESC
# which makes TUI apps (OpenCode, vim, etc.) feel sluggish
set -sg escape-time 0

# Enable extended-keys so modified Enter (Shift/Ctrl/Alt+Enter)
# is forwarded to TUI apps like pi/Claude Code
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g history-limit 20000
set -g mouse on
set -g status off

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
