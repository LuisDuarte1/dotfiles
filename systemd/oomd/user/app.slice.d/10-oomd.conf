# Watch memory pressure at app.slice (user apps) instead of at user@.service.
#
# When sustained memory pressure exceeds the limit, systemd-oomd will kill
# one of app.slice's children -- e.g. a runaway browser, editor, or Electron
# app -- rather than init.scope / session.slice / pipewire / wireplumber,
# which would tear down the whole session.

[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
