# Override systemd's shipped /usr/lib/systemd/system/user@.service.d/10-oomd-user-service-defaults.conf
#
# That default sets ManagedOOMMemoryPressure=kill with a 50% limit on the
# whole user@<uid>.service. When memory pressure trips, systemd-oomd then
# picks one of user@.service's immediate children (app.slice, session.slice,
# background.slice, init.scope) and kills it. If init.scope is chosen the
# entire graphical session dies (systemd --user exits and takes every app
# and service with it).
#
# We disable the watch at this level and move it to app.slice instead (see
# /etc/systemd/user/app.slice.d/10-oomd.conf) so only user applications are
# ever candidates for being killed.
#
# Filename prefix is 99- so this drop-in sorts AFTER
# 10-oomd-user-service-defaults.conf and its settings win. systemd merges
# drop-ins in lexical order across /etc and /usr/lib.

[Service]
ManagedOOMMemoryPressure=auto
ManagedOOMMemoryPressureLimit=
